<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오미 기획전 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--white:#FFFDF7;--green:#5E9E4B;--beige:#D4C4A8;--cream:#FBF3E4;--ink:#3B2F25;--soft:#EFE5D2}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}
.who{background:var(--ink);color:var(--white);padding:10px 48px;font-size:14px;display:flex;justify-content:space-between}
.nav{display:flex;align-items:center;gap:28px;padding:16px 48px;background:var(--white);border-bottom:2px solid var(--beige)}
.nav .logo{display:flex;align-items:center;gap:10px;font-family:'Jua';font-size:24px;color:var(--green)}
.nav .menu{display:flex;gap:22px;margin-left:auto;font-size:15px}
.nav .cta{background:var(--green);color:var(--white);padding:8px 18px;border-radius:999px;font-size:15px}
section{padding:64px 72px;position:relative}
section.cream{background:var(--cream)} section.white{background:var(--white)} section.beige{background:var(--soft)}
.no{position:absolute;top:20px;left:24px;font-size:12px;color:#8a7a66;letter-spacing:.05em}
.eyebrow{display:inline-block;background:var(--green);color:var(--white);font-size:13px;padding:3px 12px;border-radius:999px;margin-bottom:10px}
h2{font-size:42px;color:var(--green);margin-bottom:6px}
.sub{font-size:16px;color:#6b5a48;margin-bottom:24px}
.row{display:grid;grid-template-columns:340px 1fr;gap:48px;align-items:start}
.row.right{grid-template-columns:1fr 340px}
.row.right .charcol{order:2}
.center{text-align:center}
.center .charcol{display:flex;justify-content:center;gap:24px;margin:18px 0}
.oc{width:260px;aspect-ratio:344/384;background:url(character-sheet.png) no-repeat;background-size:400% 200%;border-radius:24px}
.oc.sm{width:150px}
.bubble{position:relative;background:var(--white);border:2px solid var(--ink);border-radius:22px;padding:16px 20px;font-size:19px;margin-top:14px}
.bubble:before{content:"";position:absolute;top:-12px;left:60px;width:18px;height:18px;background:var(--white);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.center .bubble{max-width:760px;margin:10px auto 0}
.pains{display:flex;gap:18px;justify-content:center;margin:8px 0 6px}
.pain{background:var(--white);border:2px dashed var(--beige);border-radius:18px;padding:14px 20px;font-size:18px;min-width:280px}
.pain b{display:block;font-family:'Jua';font-size:15px;color:var(--green);font-weight:400}
.steps{display:flex;gap:14px;margin:6px 0 22px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:16px;padding:12px 18px;border:2px solid var(--beige)}
.step i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--white);display:grid;place-items:center;font-family:'Jua';font-size:18px}
.arrow{color:var(--green);font-size:22px}
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:16px;margin-top:6px}
.card{background:var(--white);border:1.5px solid var(--ink);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.card .ph{height:70px;border-radius:12px;background:repeating-linear-gradient(45deg,#f3ecdf,#f3ecdf 8px,#ebe1cf 8px,#ebe1cf 16px);display:grid;place-items:center;font-size:12px;color:#9b8a73}
.card .nm{font-weight:700;font-size:17px}
.tag{align-self:flex-start;font-size:12px;padding:2px 10px;border-radius:999px}
.tag.real{background:var(--beige);color:var(--ink)}
.tag.plan{background:#e3efdc;color:#3c6d2e}
.tag.alley,.tag.book{background:#f1e7d3;color:#7a5b2e;border:1px solid var(--beige)}
.price{font-family:'Jua';font-size:20px;color:var(--ink)}
.desc{font-size:14px;color:#6b5a48}
.band{background:var(--green);color:var(--white);border-radius:14px;padding:12px 20px;font-family:'Jua';font-size:22px;margin:22px 0 4px;text-align:center}
.btns{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.center .btns{justify-content:center}
.btn{background:var(--green);color:var(--white);border-radius:999px;padding:12px 24px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn .soon{font-size:11px;background:var(--white);color:var(--green);border-radius:999px;padding:1px 7px;margin-left:6px}
table{border-collapse:collapse;width:100%;background:var(--white);border-radius:14px;overflow:hidden;margin-top:6px}
th,td{padding:10px 14px;border-bottom:1px solid var(--soft);text-align:left;font-size:15px}
th{background:var(--beige);font-weight:700}
.list{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:10px;margin-top:6px}
.list div{background:var(--white);border:1px solid var(--beige);border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.listh{font-family:'Jua';font-size:18px;color:var(--green);margin:16px 0 4px}
.notes{margin-top:18px;font-size:13px;color:#7a6a56}
.notes p{margin:3px 0}
.counter{display:inline-flex;gap:24px;background:var(--white);border:2px solid var(--green);border-radius:16px;padding:12px 22px;margin-top:18px;font-family:'Jua';font-size:20px}
.counter b{color:var(--green);font-weight:400}
.bundle3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.bcard{background:var(--white);border:1.5px solid var(--ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.bcard h3{font-size:26px;color:var(--green)}
.bcard .who2{font-size:13px;background:var(--beige);border-radius:999px;padding:2px 10px}
.bcard dl{text-align:left;width:100%;font-size:14px}
.bcard dt{font-weight:700;margin-top:6px} .bcard dd{color:#6b5a48}
footer{background:var(--ink);color:var(--white);padding:28px 72px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BOX={1:[110,0,270,410],2:[440,0,260,410],3:[770,0,260,410],4:[1095,0,230,410],5:[120,425,250,310],6:[420,425,260,310],7:[755,425,280,310],8:[1045,425,320,310]};
const oc=(n,cls='',W)=>{const [x,y,w,h]=BOX[n];W=W||(cls==='sm'?150:240);const s=W/w;return `<div class="oc ${cls}" style="width:${W}px;height:${Math.round(h*s)}px;aspect-ratio:auto;background-size:${1376*s}px ${768*s}px;background-position:${-x*s}px ${-y*s}px"></div>`};
const C={
 R1:{nm:'태화오리탕 택배',tag:'real',price:'반 마리 36,900원 · 한 마리 59,900원',desc:"네이버 스마트스토어 '태화오리탕'"},
 R2:{nm:'전라도미가 오리탕 800g × 4팩 밀키트',tag:'real',price:'48,900원',desc:'쿠팡 (판매자 전라도미가) · 유동 골목 밖 가게'},
 R3:{nm:'산지한입 돌미나리',tag:'real',price:'20,800원~ / 20,900원',desc:'11번가 · G마켓 (가치드림마켓)'},
 R4:{nm:'곡물제작소 들깨가루 250g',tag:'real',price:'15,900원 + 배송비 3,000원',desc:'남도장터'},
 P2:{nm:'집에서 한 그릇 세트',tag:'plan',price:'9,900원 (+ 택배 추가 시 46,800원 · 58,800원)',desc:'미나리 + 들깨 초장 · 추가 옵션: 택배 오리탕(R1 반 마리 +36,900원 또는 R2 +48,900원)'},
 P3:{nm:'오미 웰컴 키트',tag:'plan',price:'9,000원',desc:'먹는 법 카드 + 골목 지도 카드 + 미나리 추가권 + 오미 손수건'},
 G1:{nm:'오미 키링',tag:'plan',price:'7,000원',desc:'미나리 꽂은 오미'},
 G2:{nm:'오미 수저받침',tag:'plan',price:'8,000원',desc:'미나리 꽂은 흰 오리 모양'},
 G3:{nm:'오미네 식구 스티커 팩',tag:'plan',price:'3,000원',desc:'오미 · 뭉근 할매 · 고소미 · 파릇이 · 토란이'},
 G4:{nm:'오미 앞치마',tag:'plan',price:'20,000원',desc:'들깨 베이지, 세로 점 5개'},
 G5:{nm:'오미 에코백',tag:'plan',price:'15,000원',desc:'들깨 베이지, 평상에 앉은 오미'},
 G6:{nm:'푸른길 텀블러',tag:'plan',price:'25,000원',desc:'미나리 초록 몸통 + 들깨 베이지 뚜껑'},
 A1:{nm:'미나리 먼저 한 상',tag:'alley',price:'가게 가격 그대로',desc:'첫 접시는 미나리 먼저, 들깨 초장 첫 콕'},
 A2:{nm:'효도 한 상',tag:'alley',price:'가게 가격 그대로',desc:'입식 자리 + 미나리 한 번 더 + 오미 선물'},
 A3:{nm:'평상 쉼표',tag:'alley',price:'무료',desc:'다 먹고 골목 평상에서 잠깐 쉬기'},
 A4:{nm:'푸른길 소화 산책',tag:'alley',price:'무료',desc:'한 그릇 먹고 푸른길까지 천천히'},
 A5:{nm:'경기 날 반 마리 + 산책 카드',tag:'alley',price:'무료 안내물',desc:'둘이면 반 마리, 푸른길 산책 지도 카드'},
 A6:{nm:'오미 한 그릇 적립',tag:'alley',price:'손님 추가 부담 없음',desc:'100그릇마다 동네 어르신께 한 그릇'},
 K1:{nm:'오미 웰컴 키트 (효도)',tag:'plan',price:'3,000원',desc:'인쇄지 1장 + 오미 손편지 카드 + 오미 쿠폰'},
 K2:{nm:'오미 웰컴 키트',tag:'plan',price:'3,000원',desc:'인쇄지 1장 + 오미 스티커 + 오미 쿠폰'},
 B1:{nm:'식당 예약',tag:'book',price:'가게 가격 그대로 (반 마리 40,000원 · 한 마리 60,000원)',desc:'골목 가게 9곳 중 손님이 직접 고름'},
 B2:{nm:'숙소 예약',tag:'book',price:'협업 숙소 10% 할인 · 1박 46,710원~',desc:'숙소 6곳 중 손님이 직접 고름'},
};
const TAG={real:'연계 희망(협의 전)',plan:'직접 구성(기획 상품) · 예시 가격',alley:'골목에서 · 가게 협의 전',book:'손님이 직접 선택 · 협의 전'};
const KIT=(who)=>`<div class="listh">웰컴 키트 안에</div><div class="list" style="--cols:1"><div>인쇄지 1장: 먹는 법 · 몇 명이면 얼마나 · 골목 가게 9곳 지도(주차 · 브레이크타임) · 덜 붐비는 시간(예측, 리뷰 기준) · 푸른길 산책 · 숙소 가는 길</div><div>${who}</div><div>오미 쿠폰: 제휴 식당 미나리 한 바구니 추가 · 제휴 카페 10% 할인 (제휴처 미정 · 협의 전)</div></div>`;
const PRICE=(rows)=>`<div class="listh">묶음 가격 예시 (웰컴 키트 3,000원 + 숙소 1박 10% 할인 + 오리탕 가게 가격)</div><table><tr><th>사람 · 고른 것</th><th>계산</th><th>합계</th></tr>${rows.map(([a,b,c])=>`<tr><td>${a}</td><td>${b}</td><td><b>${c}</b></td></tr>`).join('')}</table>`;
const OPT=(ks)=>`<div class="listh">추가 옵션 (원하는 분만)</div>`+cards(ks,ks.length,{R1:{price:'반 마리 36,900원 · 한 마리 59,900원'}});
const card=(k,o={})=>{const c={...C[k],...o};return `<div class="card"><div class="ph">${c.tag==='real'?'사진 없음 (판매처 허락 전)':'그림 자리'}</div><span class="tag ${c.tag}">${TAG[c.tag]}</span><div class="nm">${c.nm}</div><div class="price">${c.price}</div><div class="desc">${c.desc}</div></div>`};
const cards=(ks,cols=3,o={})=>`<div class="cards" style="--cols:${cols}">${ks.map(k=>card(k,o[k]||{})).join('')}</div>`;
const btns=a=>`<div class="btns">${a.map(b=>{const s=b.endsWith('*');const t=s?b.slice(0,-1):b;return `<span class="btn${t.startsWith('~')?' ghost':''}">${t.replace(/^~/,'')}${s?'<span class="soon">준비 중</span>':''}</span>`}).join('')}</div>`;
const steps=a=>`<div class="steps">${a.map((s,i)=>`${i?'<span class="arrow">→</span>':''}<div class="step"><i>${i+1}</i>${s}</div>`).join('')}</div>`;
const notes=a=>`<div class="notes">${a.map(n=>`<p>${n}</p>`).join('')}</div>`;
const listBlock=(h,a,cols=4)=>`<div class="listh">${h}</div><div class="list" style="--cols:${cols}">${a.map(x=>`<div>${x}</div>`).join('')}</div>`;
const stayTable=`<table><tr><th>1박 2일</th><th>사람</th><th>1일차 저녁</th><th>2일차</th><th>묶음 가격 (예시)</th></tr>
<tr><td>효도</td><td>3명</td><td>효도 한 상 · 한 마리</td><td>1인분 × 3</td><td>199,500원</td></tr>
<tr><td>효도</td><td>2명</td><td>효도 한 상 · 반 마리</td><td>1인분 × 2</td><td>155,500원</td></tr>
<tr><td>처음</td><td>2명</td><td>미나리 먼저 한 상 · 반 마리</td><td>1인분 × 2</td><td>142,000원</td></tr>
<tr><td>경기 날</td><td>2명</td><td>반 마리</td><td>1인분 × 2</td><td>125,710원</td></tr></table>`;
const sec=(o)=>{
 const char=o.chars?o.chars.map(n=>oc(n,o.smallChar?'sm':'')).join(''):'';
 const bubble=o.bubble?`<div class="bubble">${o.bubble}</div>`:'';
 const head=`${o.eyebrow?`<span class="eyebrow">${o.eyebrow}</span>`:''}<h2>${o.title}</h2>${o.sub?`<div class="sub">${o.sub}</div>`:''}`;
 if(o.layout==='center') return `<section class="${o.bg||'cream'}"><span class="no">${o.no}</span><div class="center">${head}${o.pre||''}<div class="charcol">${char}</div>${bubble}${o.body||''}${o.btns?btns(o.btns):''}${o.notes?notes(o.notes):''}</div></section>`;
 if(o.layout==='full') return `<section class="${o.bg||'cream'}"><span class="no">${o.no}</span>${head}${o.body||''}${o.btns?btns(o.btns):''}${o.notes?notes(o.notes):''}</section>`;
 return `<section class="${o.bg||'cream'}"><span class="no">${o.no}</span>${head}${o.pre||''}<div class="row ${o.layout==='right'?'right':''}"><div class="charcol">${char}${bubble}</div><div>${o.body||''}</div></div>${o.band?`<div class="band">${o.band}</div>`:''}${o.btns?btns(o.btns):''}${o.notes?notes(o.notes):''}</section>`;
};
const footer=`<footer>수업용 기획안이며, 소개한 가게 · 판매처와 제휴하지 않았습니다 · AX 크리에이티브 6팀</footer>`;
const pains=a=>`<div class="pains">${a.map(([w,t])=>`<div class="pain"><b>${w}</b>${t}</div>`).join('')}</div>`;
const PAIN3=pains([['처음 온 여행객','먹는 법을 몰라요'],['부모님 모시고 온 가족','몇 마리 시켜야 할지 몰라요'],['야구 경기 날 손님','경기 전이라 오래 못 기다려요']]);

const PLANS={
jun:{who:'박준영 플랜 (my-page-plan.md) · 5칸',html:[
 sec({no:'① 첫 칸 · 불편',layout:'center',eyebrow:'K-웰니스 기획전',title:'「광주식 보양, 한 그릇」',sub:'처음 오면 망설여지는 것',pre:PAIN3,chars:[1],bubble:'오미~ 먹는 법도, 몇 마리 시킬지도 몰라 망설여지죠? 괜찮아요, 한 그릇씩 천천히 알려 드릴게요.',btns:['처음이에요','부모님과 와요','경기 날 들러요']}),
